<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORVINA BAY</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    .start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a0a0a, #0d0202); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .title { font-size: 4rem; margin-bottom: 1rem; }
    .subtitle { font-size: 1.5rem; margin-bottom: 2rem; }
    .btn-play { padding: 0.8rem 2rem; font-size: 1.2rem; background: #e50914; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .controls { position: absolute; bottom: 20px; left: 20px; color: #fff; font-size: 0.9rem; }
    canvas#game { display: block; }
    #hud, #minimap-canvas { position: absolute; }
    #hud { top: 20px; left: 20px; color: #fff; }
    #minimap-canvas { bottom: 20px; right: 20px; width: 200px; height: 200px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div class="start-screen">
    <h1 class="title">CORVINA BAY</h1>
    <p class="subtitle">an original open-world crime story</p>
    <button id="btn-play" class="btn-play">Play</button>
  </div>
  <canvas id="game"></canvas>
  <div id="hud">HUD</div>
  <canvas id="minimap-canvas"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
